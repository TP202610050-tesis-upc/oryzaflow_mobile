name: oryzaflow_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Iconos de Material Design
  cupertino_icons: ^1.0.8

  # Red
  http: ^1.2.1
  dio: ^5.7.0
  connectivity_plus: ^6.0.3

  # Seguridad
  flutter_secure_storage: ^10.0.0
  jwt_decoder: ^2.0.1

  # Gestión de Estado
  provider: ^6.1.2

  # Gráficos y UI
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Logs
  logger: ^2.3.0

  # Inyección de dependencias
  get_it: ^8.0.0

  # Navegación
  go_router: ^14.0.0

  # UI Extras
  shimmer: ^3.0.0
  equatable: ^2.0.5

  # File system & sharing
  path_provider: ^2.1.4
  share_plus: ^13.0.0

  # Permisos del SO y persistencia local de preferencias
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2

  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/oryzaflow-logo.png

# Splash nativo: fondo verde (AppColors.verde) + logo en badge blanco, en claro y
# oscuro, para fundirse con el splash Flutter y eliminar el destello negro.
flutter_native_splash:
  color: "#2E7D32"
  color_dark: "#2E7D32"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#2E7D32"
    color_dark: "#2E7D32"
    image: assets/icon/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"