name: oryzaflow_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Iconos de Material Design
  cupertino_icons: ^1.0.8

  # Red
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # Seguridad
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1

  # Gestión de Estado
  provider: ^6.1.2

  # Gráficos y UI
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Logs
  logger: ^2.3.0

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true